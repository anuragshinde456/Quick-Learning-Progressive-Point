<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Faculty Portal - Quick Progressive Career Point Odisha</title>
  <meta name="description" content="Teacher Faculty Portal for Quick Progressive Career Point home tutors in Odisha. Manage teaching applications and assigned students.">
  
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/logo.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="styles.css?v=20261122_v1">
</head>
<body>

  <!-- Header Navigation -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <img src="assets/logo.png" alt="QPCP Logo" class="brand-logo-img">
        <div class="brand-title">
          Quick Progressive <span>Career Point</span>
        </div>
      </a>

      <ul class="nav-links desktop-only">
        <li><a href="index.html" class="nav-link" data-page="home">Home</a></li>
        <li><a href="about.html" class="nav-link" data-page="about">About Us</a></li>
        <li><a href="gallery.html" class="nav-link" data-page="gallery">Gallery</a></li>
      </ul>

      <div class="auth-buttons desktop-only" id="nav-auth-container"></div>

      <button class="mobile-menu-btn" aria-label="Toggle Navigation" type="button">
        <i class="fa-solid fa-bars" id="mobile-menu-icon"></i>
      </button>
    </div>

    <!-- Mobile Drawer -->
    <div class="mobile-drawer" id="mobile-drawer">
      <ul class="mobile-nav-links">
        <li><a href="index.html" class="mobile-nav-link" data-page="home"><i class="fa-solid fa-house" style="color: var(--primary);"></i> Home</a></li>
        <li><a href="about.html" class="mobile-nav-link" data-page="about"><i class="fa-solid fa-circle-info" style="color: var(--primary);"></i> About Us</a></li>
        <li><a href="gallery.html" class="mobile-nav-link" data-page="gallery"><i class="fa-solid fa-images" style="color: var(--primary);"></i> Gallery</a></li>
      </ul>
      <div class="mobile-auth-container" id="mobile-auth-container" style="padding: 1rem 0; border-top: 1px solid var(--glass-border); margin-top: 1rem;"></div>
    </div>
  </header>

  <!-- Main Content -->
  <main style="padding-top: 2rem; padding-bottom: 4rem;">
    <div class="container" id="teacher-root">
      <!-- Injected dynamically based on whether user is pending applicant or verified teacher -->
      <div style="text-align: center; padding: 4rem 1rem;">
        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2rem; color: var(--primary);"></i>
        <p style="color: var(--text-muted); margin-top: 0.75rem;">Loading your teacher portal...</p>
      </div>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal-overlay" id="edit-teacher-modal">
      <div class="modal-card">
        <button class="modal-close"><i class="fa-solid fa-xmark"></i></button>
        <h2 class="modal-title">Edit Faculty Profile</h2>
        <p class="modal-subtitle">Update your teaching details below.</p>

        <form id="teacher-edit-form">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" id="edit-tch-name" required>
          </div>

          <div class="form-group">
            <label class="form-label">Phone Number (10 Digits)</label>
            <input type="tel" class="form-control" id="edit-tch-phone" required maxlength="10">
          </div>

          <div class="form-group">
            <label class="form-label">Subjects (Comma separated)</label>
            <input type="text" class="form-control" id="edit-tch-subjects" required>
          </div>

          <div class="form-group">
            <label class="form-label">Hourly Fee (₹)</label>
            <input type="number" class="form-control" id="edit-tch-rate" required min="100">
          </div>

          <div class="form-group">
            <label class="form-label">Teaching Locality / City in Odisha</label>
            <input type="text" class="form-control" id="edit-tch-location" required>
          </div>

          <div class="form-group">
            <label class="form-label">Bio & Qualifications</label>
            <textarea class="form-control" id="edit-tch-bio" rows="3"></textarea>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
            <i class="fa-solid fa-floppy-disk"></i> Save Profile Changes
          </button>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer"></footer>

  <script type="module">
    import { store } from './store.js?v=20261122_v1';
    import { shared } from './shared.js?v=20261122_v1';

    let activeTab = 'students';

    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Verify teacher auth (either applicant or verified)
      if (!shared.requireAuth(['verified_teacher', 'teacher_applicant'])) return;

      shared.init('teacher-dashboard');

      // Initial render
      renderTeacherPortal();

      // Background Supabase sync
      try {
        await store.syncFromSupabase();
        renderTeacherPortal();
      } catch (e) {
        console.warn('Sync notice:', e);
      }

      // Attach profile edit form handler
      const editForm = document.getElementById('teacher-edit-form');
      if (editForm) {
        editForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const u = store.getCurrentUser();
          if (!u) return;

          const name = document.getElementById('edit-tch-name').value.trim();
          const rawPhone = document.getElementById('edit-tch-phone').value.trim();
          const subjects = document.getElementById('edit-tch-subjects').value.trim();
          const rate = Number(document.getElementById('edit-tch-rate').value) || 500;
          const location = document.getElementById('edit-tch-location').value.trim();
          const bio = document.getElementById('edit-tch-bio').value.trim();

          const cleanPhone = rawPhone.replace(/[^0-9]/g, '');
          if (!/^[6-9]\d{9}$/.test(cleanPhone)) {
            shared.showToast('Please enter a valid 10-digit mobile number.', 'error');
            return;
          }

          try {
            await store.updateUserProfile(u.id, {
              name,
              phone: `+91 ${cleanPhone}`,
              subjects: subjects.split(',').map(s => s.trim()),
              rate,
              location,
              bio
            });
            shared.showToast('Faculty profile updated successfully!', 'success');
            shared.closeModal('edit-teacher-modal');
            renderTeacherPortal();
          } catch (err) {
            shared.showToast(err.message || 'Failed to update profile.', 'error');
          }
        });
      }
    });

    function renderTeacherPortal() {
      const root = document.getElementById('teacher-root');
      const user = store.getCurrentUser();
      if (!root || !user) return;

      // CASE A: TEACHER APPLICANT (PENDING ADMIN REVIEW)
      if (user.role === 'teacher_applicant') {
        const subs = Array.isArray(user.subjects) ? user.subjects.join(', ') : user.subjects;
        const waMsg = encodeURIComponent(`Hello Admin, I have submitted my home tutor application in Odisha (${user.name}). Please review my demo video.`);

        root.innerHTML = `
          <div style="max-width: 680px; margin: 0 auto; background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); padding: 2.5rem 2rem; box-shadow: var(--glass-shadow); text-align: center;">
            <div style="width: 72px; height: 72px; border-radius: 50%; background: #fffbeb; color: var(--accent-amber); display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 1.25rem; border: 2px solid #fde68a;">
              <i class="fa-solid fa-hourglass-half"></i>
            </div>

            <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem;">Application Under Review</h1>
            <p style="color: var(--text-muted); font-size: 1rem; line-height: 1.6; margin-bottom: 1.75rem;">
              Welcome, <strong>${user.name}</strong>! Your application to teach as a 1-on-1 home tutor in <strong>${user.location || 'Odisha'}</strong> has been received by <strong>Quick Progressive Career Point</strong>.
            </p>

            <div style="background: var(--bg-main); border: 1px solid var(--glass-border); border-radius: var(--radius-md); padding: 1.25rem; text-align: left; margin-bottom: 1.75rem;">
              <div style="font-weight: 700; color: var(--text-main); margin-bottom: 0.75rem;"><i class="fa-solid fa-list-check" style="color: var(--primary);"></i> Application Summary:</div>
              <ul style="list-style: none; font-size: 0.9rem; line-height: 1.8; color: var(--text-muted);">
                <li><strong>Subjects:</strong> ${subs || 'General'}</li>
                <li><strong>Teaching Location:</strong> ${user.location || 'Odisha'}</li>
                <li><strong>Hourly Charge:</strong> ₹${user.rate || 500}/hr</li>
                <li><strong>Experience:</strong> ${user.experience || 'Experienced'}</li>
                <li><strong>Registered Phone:</strong> ${user.phone || '-'}</li>
              </ul>
            </div>

            <div style="background: #eff6ff; border: 1px solid #bfdbfe; border-radius: var(--radius-md); padding: 1rem; color: #1e40af; font-size: 0.88rem; line-height: 1.5; margin-bottom: 2rem; text-align: left;">
              <i class="fa-solid fa-circle-info" style="margin-right: 0.4rem;"></i> <strong>What happens next?</strong> Our Admin team will review your demo video and contact you via WhatsApp/Phone for a short verification interview. Once approved, you will be published live!
            </div>

            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
              <a href="https://wa.me/917008221300?text=${waMsg}" target="_blank" class="btn btn-whatsapp">
                <i class="fa-brands fa-whatsapp"></i> Chat with Admin on WhatsApp
              </a>
              <button class="btn btn-secondary" onclick="shared.handleLogout()">
                <i class="fa-solid fa-power-off"></i> Log Out
              </button>
            </div>
          </div>
        `;
        return;
      }

      // CASE B: VERIFIED TEACHER (APPROVED ACTIVE FACULTY)
      const subs = Array.isArray(user.subjects) ? user.subjects.join(', ') : user.subjects;
      const myAsgs = store.getAssignmentsForTeacher(user.id) || [];
      const studentsPrivacy = store.getStudentsPrivacyProtected() || [];

      root.innerHTML = `
        <div class="page-header-wrap" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem;">
          <div>
            <span class="role-badge verified_teacher"><i class="fa-solid fa-user-check"></i> Verified Home Faculty</span>
            <h1 class="page-title" style="margin-top: 0.35rem; font-size: 1.75rem;">Welcome, ${user.name}!</h1>
            <div style="font-size: 0.88rem; color: var(--text-muted); margin-top: 0.25rem;">
              <i class="fa-solid fa-location-dot" style="color: var(--primary);"></i> ${user.location || 'Odisha'} &nbsp;•&nbsp; 
              <span style="color: var(--accent-emerald); font-weight: 700;">₹${user.rate || 500}/hr</span>
            </div>
          </div>
          <div class="page-header-actions" style="display: flex; gap: 0.5rem;">
            <button class="btn btn-secondary btn-sm" id="edit-tch-btn"><i class="fa-solid fa-user-gear"></i> Edit Profile</button>
            <a href="index.html" class="btn btn-primary btn-sm"><i class="fa-solid fa-eye"></i> View Public Site</a>
          </div>
        </div>

        <div class="dashboard-grid">
          <!-- Sidebar Navigation -->
          <div class="sidebar-card">
            <div class="user-profile-header" style="text-align: center; margin-bottom: 1.5rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--glass-border);">
              <img src="${user.avatar || 'https://ui-avatars.com/api/?name=Faculty'}" alt="Teacher Avatar" style="width: 72px; height: 72px; border-radius: 50%; object-fit: cover; margin-bottom: 0.75rem; border: 3px solid #a7f3d0;">
              <h3 style="font-size: 1.15rem; margin-bottom: 0.2rem;">${user.name}</h3>
              <p style="color: var(--text-muted); font-size: 0.85rem;">@${user.username || 'teacher'}</p>
              <div style="font-size: 0.85rem; color: var(--primary); font-weight: 600; margin-top: 0.4rem;">${subs}</div>
              <div style="font-size: 0.88rem; color: var(--accent-emerald); font-weight: 700; margin-top: 0.25rem;">₹${user.rate || 500}/hr</div>
            </div>

            <ul class="sidebar-nav" id="teacher-nav-tabs">
              <li class="sidebar-nav-item">
                <button class="sidebar-nav-btn ${activeTab === 'students' ? 'active' : ''}" data-tab="students">
                  <i class="fa-solid fa-users"></i> Available Students (${studentsPrivacy.length})
                </button>
              </li>
              <li class="sidebar-nav-item">
                <button class="sidebar-nav-btn ${activeTab === 'assigned' ? 'active' : ''}" data-tab="assigned">
                  <i class="fa-solid fa-user-check"></i> My Assigned Slots (${myAsgs.length})
                </button>
              </li>
            </ul>
          </div>

          <!-- Main Tab Content -->
          <div class="main-dash-content" id="teacher-tab-content"></div>
        </div>
      `;

      // Attach tab switcher clicks
      const tabBtns = document.querySelectorAll('#teacher-nav-tabs .sidebar-nav-btn');
      tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          tabBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeTab = btn.getAttribute('data-tab') || 'students';
          renderTeacherTabBody(user, studentsPrivacy, myAsgs);
        });
      });

      // Attach profile edit modal trigger
      const editBtn = document.getElementById('edit-tch-btn');
      if (editBtn) {
        editBtn.addEventListener('click', () => {
          document.getElementById('edit-tch-name').value = user.name || '';
          document.getElementById('edit-tch-phone').value = (user.phone || '').replace(/[^0-9]/g, '').slice(-10);
          document.getElementById('edit-tch-subjects').value = Array.isArray(user.subjects) ? user.subjects.join(', ') : (user.subjects || '');
          document.getElementById('edit-tch-rate').value = user.rate || 500;
          document.getElementById('edit-tch-location').value = user.location || '';
          document.getElementById('edit-tch-bio').value = user.bio || '';
          shared.openModal('edit-teacher-modal');
        });
      }

      renderTeacherTabBody(user, studentsPrivacy, myAsgs);
    }

    function renderTeacherTabBody(user, studentsPrivacy, myAsgs) {
      const container = document.getElementById('teacher-tab-content');
      if (!container) return;

      if (activeTab === 'students') {
        container.innerHTML = `
          <div style="background: #eff6ff; border: 1px solid #bfdbfe; border-radius: var(--radius-md); padding: 0.85rem 1rem; color: #1e40af; font-size: 0.85rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
            <i class="fa-solid fa-lock"></i>
            <span><strong>Privacy Protection Active:</strong> As per QPCP policy, student phone & email are confidential. You can apply to teach students below, and Admin will connect you.</span>
          </div>

          <h2 style="font-size: 1.35rem; margin-bottom: 1.25rem;">Students Seeking Home Tutors in Odisha</h2>

          ${studentsPrivacy.length === 0 ? `
            <div style="background: var(--bg-card); border: 1px solid var(--glass-border); padding: 3rem 1.5rem; text-align: center; border-radius: var(--radius-lg);">
              <i class="fa-solid fa-users-slash" style="font-size: 2.5rem; color: var(--text-dim); margin-bottom: 1rem;"></i>
              <h3>No Students Looking for Tutors Right Now</h3>
              <p style="color: var(--text-muted);">New student tutoring requests will appear here as soon as they register.</p>
            </div>
          ` : `
            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem;">
              ${studentsPrivacy.map(s => `
                <div style="background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: var(--radius-md); padding: 1.25rem; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--glass-shadow);">
                  <div>
                    <div style="display: flex; gap: 0.75rem; align-items: center; margin-bottom: 0.75rem;">
                      <img src="${s.avatar || 'https://ui-avatars.com/api/?name=Student'}" alt="${s.name}" style="width: 46px; height: 46px; border-radius: 50%; object-fit: cover;">
                      <div>
                        <h4 style="font-size: 1.05rem; margin: 0;">${s.name}</h4>
                        <div style="font-size: 0.78rem; color: var(--text-muted);"><i class="fa-solid fa-location-dot" style="color: var(--primary);"></i> ${s.location}</div>
                      </div>
                    </div>
                    <div style="background: var(--bg-main); border: 1px solid var(--glass-border); padding: 0.6rem 0.75rem; border-radius: var(--radius-sm); font-size: 0.82rem; margin-bottom: 0.75rem;">
                      <strong>Grade/Prep:</strong> ${s.grade || 'General Study'}
                    </div>
                    <div style="margin-bottom: 1rem;">
                      <span class="privacy-lock-tag" style="background: #f1f5f9; color: var(--text-dim); font-size: 0.72rem; padding: 0.2rem 0.5rem; border-radius: var(--radius-sm); border: 1px solid var(--glass-border);">
                        <i class="fa-solid fa-user-secret"></i> Contact Details Hidden by Admin
                      </span>
                    </div>
                  </div>

                  <button class="btn btn-primary btn-sm apply-teach-btn" data-sid="${s.id}" data-sname="${s.name}" style="width: 100%;">
                    <i class="fa-solid fa-paper-plane"></i> Apply to Teach Student
                  </button>
                </div>
              `).join('')}
            </div>
          `}
        `;

        // Attach apply to teach handler
        container.querySelectorAll('.apply-teach-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            const sid = btn.getAttribute('data-sid');
            const sname = btn.getAttribute('data-sname');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-check"></i> Request Sent';

            try {
              await store.createTeacherRequestToTeach(user.id, sid);
              shared.showToast(`Request to teach ${sname} sent to Admin!`, 'success');
            } catch (err) {
              shared.showToast(err.message || 'Failed to send request.', 'error');
              btn.disabled = false;
              btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Apply to Teach Student';
            }
          });
        });
      } else if (activeTab === 'assigned') {
        container.innerHTML = `
          <h2 style="font-size: 1.35rem; margin-bottom: 0.85rem;">Official Assigned Home Slots</h2>
          <p style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 1.5rem;">Students officially paired with you by Admin for 1-on-1 home tutoring.</p>

          ${myAsgs.length === 0 ? `
            <div style="background: var(--bg-card); border: 1px solid var(--glass-border); padding: 3rem 1.5rem; text-align: center; border-radius: var(--radius-lg);">
              <i class="fa-solid fa-clipboard-user" style="font-size: 2.8rem; color: var(--text-dim); margin-bottom: 1rem;"></i>
              <h3>No Assigned Home Slots Yet</h3>
              <p style="color: var(--text-muted);">When Admin approves a student request and pairs them with you, they will appear here with full details.</p>
            </div>
          ` : `
            <div class="data-table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Student Name</th>
                    <th>Locality in Odisha</th>
                    <th>Grade / Subject</th>
                    <th>Assigned Date</th>
                    <th>Slot Status</th>
                  </tr>
                </thead>
                <tbody>
                  ${myAsgs.map(a => `
                    <tr>
                      <td><strong>${a.studentName || 'Student'}</strong></td>
                      <td>${a.studentLocation || 'Odisha'}</td>
                      <td>${a.studentGrade || 'Home Tutoring'}</td>
                      <td>${a.assignedAt ? new Date(a.assignedAt).toLocaleDateString() : 'Active'}</td>
                      <td><span class="role-badge verified_teacher">Active Home Slot</span></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `}
        `;
      }
    }
  </script>
</body>
</html>
